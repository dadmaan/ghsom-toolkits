site_name: GHSOM Toolkits Documentation
site_description: Visualization and analysis tools for Growing Hierarchical Self-Organizing Maps
site_author: GHSOM-Py Contributors
site_url: https://dadmaan.github.io/ghsom-toolkits/

repo_name: dadmaan/ghsom-toolkits
repo_url: https://github.com/dadmaan/ghsom-toolkits

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Quick Start: quickstart.md
  - Tutorials:
    - Basic Visualization: tutorials/01_basic_visualization.md
    - Interactive Dashboard: tutorials/02_interactive_dashboard.md
    - Model Comparison: tutorials/03_model_comparison.md
    - Generating Reports: tutorials/04_generating_reports.md
    - ghsom-py Integration: tutorials/05_ghsom_py_integration.md
  - API Reference:
    - Plotting Functions: api/plotting.md
    - Interactive Tools: api/interactive.md
    - Analysis Tools: api/analysis.md
    - Adapters: api/adapters.md
  - Gallery: gallery.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dadmaan/ghsom-toolkits
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/ghsom-toolkits/
