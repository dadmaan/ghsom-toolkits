[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghsom-toolkits"
version = "0.1.0"
description = "Visualization and analysis tools for GHSOM (Growing Hierarchical Self-Organizing Maps)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "GHSOM-Py Contributors"}
]
keywords = ["ghsom", "self-organizing-map", "visualization", "clustering", "unsupervised-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "ghsom-py>=0.1.0",
    "numpy>=1.20.0",
    "matplotlib>=3.5.0",
    "pydot>=1.4.2",
    "seaborn>=0.11.0",
]

[project.optional-dependencies]
pandas = [
    "pandas>=1.3.0",
]
interactive = [
    "plotly>=5.0.0",
    "dash>=2.0.0",
    "jinja2>=3.0.0",
]
analysis = [
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0",
]
all = [
    "ghsom-toolkits[pandas,interactive,analysis]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "ruff>=0.0.270",
    "mypy>=0.950",
]

[project.urls]
Homepage = "https://github.com/dadmaan/ghsom-toolkits"
Documentation = "https://dadmaan.github.io/ghsom-toolkits/"
Repository = "https://github.com/dadmaan/ghsom-toolkits"
"Bug Tracker" = "https://github.com/dadmaan/ghsom-toolkits/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ghsom_toolkits*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py38"
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "T10", "T20"]
ignore = []

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=ghsom_toolkits",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
